# 本地 Postgres：docker compose up -d
# 然后在 server/.env 里设置 DATABASE_URL=postgres://quitquit:quitquit@127.0.0.1:5432/quitquit
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quitquit
      POSTGRES_PASSWORD: quitquit
      POSTGRES_DB: quitquit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quitquit -d quitquit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
